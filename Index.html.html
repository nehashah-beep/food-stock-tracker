<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Stock Tracker</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f5f7;color:#1f2937}header{background:#1f2937;color:#fff;padding:18px 22px}main{max-width:1200px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:18px;box-shadow:0 2px 9px #0001}.row{display:flex;gap:14px;flex-wrap:wrap}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}input,select,button{padding:9px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px}button{background:#1f2937;color:white;cursor:pointer;margin:8px 6px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.food{border:1px solid #e2e8f0;border-radius:10px;padding:14px}.food h3{margin:0 0 10px}.vessel{height:120px;width:190px;margin:16px auto 8px;position:relative;overflow:hidden;border:6px solid #8b939d;border-top:13px solid #b9c0c8;border-radius:12px 12px 58px 58px;background:linear-gradient(90deg,#9ca3af,#e5e7eb 35%,#9ca3af 75%,#cbd5e1);box-shadow:inset 0 0 9px #374151}.vessel:before,.vessel:after{content:"";position:absolute;top:10px;width:23px;height:62px;border:5px solid #929aa4;border-radius:16px;z-index:0}.vessel:before{left:-25px}.vessel:after{right:-25px}.foodfill{position:absolute;bottom:0;left:0;width:100%;height:0;background:linear-gradient(#d8b66c,#b8873d);opacity:.96;transition:height .15s}.pct{text-align:center;font-size:24px;font-weight:bold}.slider{width:100%}.small{font-size:12px;color:#64748b}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ddd;padding:8px;text-align:right}th:first-child,td:first-child{text-align:left}.scroll{overflow-x:auto}</style></head><body><header><strong>Food Stock – Bowl Percentage Tracker</strong></header><main><section class="card"><h2>Daily Entry</h2><div class="row"><div class="field"><label>Date</label><input type="date" id="date"></div><div class="field"><label>Area</label><select id="area"><option>Darshnarthi Hall</option><option>Mahatma Hall</option><option>Tiffin Counter</option></select></div></div><p class="small">Default weights are used automatically. Enter today's full weight only when it changes. Data is saved in this browser on this device.</p><div class="grid" id="foods"></div><button id="save">Save Area</button><button id="refresh">Refresh Report</button></section><section class="card"><h2>Daily Report (kg remaining)</h2><div class="scroll" id="report"></div></section></main><script>
const foods=[['Dal/Kadhi',10],['Bhat/Khichdi',5],['Shak 1',3],['Kathol/Shak 2',6],['Veg. Khichdi',2],['Rotli/Bhakhri',2]];const areas=['Darshnarthi Hall','Mahatma Hall','Tiffin Counter'];let saved={};try{saved=JSON.parse(localStorage.getItem('foodStockTracker')||'{}')}catch(e){};const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);
function build(){const box=$('foods');box.innerHTML='';foods.forEach((f,i)=>{let el=document.createElement('div');el.className='food';el.innerHTML=`<h3>${f[0]}</h3><div class="field"><label>Default Full Weight (kg)</label><input value="${f[1]}" readonly></div><div class="field"><label>Today's Full Weight (optional)</label><input id="full${i}" type="number" step="0.1" placeholder="${f[1]}"></div><div class="vessel"><div class="foodfill" id="fill${i}"></div></div><div class="pct" id="pct${i}">0%</div><input class="slider" id="range${i}" type="range" min="0" max="100" step="5" value="0"><p style="text-align:center">Remaining: <b id="kg${i}">0.00 kg</b></p>`;box.appendChild(el);$('range'+i).addEventListener('input',()=>update(i));$('full'+i).addEventListener('input',()=>update(i));});}
function update(i){let p=+$('range'+i).value,full=+($('full'+i).value||foods[i][1]);$('fill'+i).style.height=p+'%';$('pct'+i).textContent=p+'%';$('kg'+i).textContent=(full*p/100).toFixed(2)+' kg';}
function load(){let r=saved[$('date').value+'|'+$('area').value];foods.forEach((f,i)=>{$('full'+i).value=r?r[i].full:'';$('range'+i).value=r?r[i].pct:0;update(i);});}
function save(){let key=$('date').value+'|'+$('area').value;saved[key]=foods.map((f,i)=>{let full=+($('full'+i).value||f[1]),pct=+$('range'+i).value;return{full,pct,kg:full*pct/100}});localStorage.setItem('foodStockTracker',JSON.stringify(saved));report();alert('Saved on this device/browser.');}
function report(){let dt=$('date').value,h='<table><tr><th>Area</th>'+foods.map(f=>'<th>'+f[0]+'</th>').join('')+'</tr>';areas.forEach(a=>{let r=saved[dt+'|'+a];h+='<tr><td>'+a+'</td>'+foods.map((f,i)=>'<td>'+(r?r[i].kg:0).toFixed(2)+'</td>').join('')+'</tr>';});h+='<tr><th>Total</th>'+foods.map((f,i)=>{let t=0;areas.forEach(a=>{let r=saved[dt+'|'+a];if(r)t+=r[i].kg});return'<th>'+t.toFixed(2)+'</th>';}).join('')+'</tr></table>';$('report').innerHTML=h;}
$('save').onclick=save;$('refresh').onclick=report;$('area').onchange=load;$('date').onchange=()=>{load();report()};build();load();report();
</script></body></html>
